name: Deploy website

# Builds marketing/site and deploys it to the Cloudflare Pages project
# solis-health (production branch main). Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  the account ID (Cloudflare dashboard, right column)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [marketing/site/**, .github/workflows/deploy-site.yml]

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: marketing/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check secrets are present
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!n}" ]; then echo "::error::Missing secret $n"; missing=1; fi
          done
          exit $missing
      - run: node tools/build.mjs
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name solis-health --branch main --commit-dirty=true
      - name: Check the live pages
        run: |
          sleep 20
          ok=1
          for p in / /privacy /terms /delete-account /pricing; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://solis-health.pages.dev$p")
            echo "$p -> $code"; echo "- $p: $code" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = 200 ] || ok=0
          done
          [ $ok = 1 ]
